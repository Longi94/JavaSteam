# These are usually filled out in your global gradle properties
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled

signing.keyId=
signing.password=
signing.secretKeyRingFile=~/.gnupg/secring.gpg

ossrhUsername=
ossrhPassword=

org.gradle.jvmargs=-Xmx2048m -Didea.max.content.load.filesize=65536
# The Kotlin compiler refuses to index Java sources larger than 20 MB
kotlin.daemon.jvmargs=-Xmx2048m -Didea.max.content.load.filesize=65536

org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
